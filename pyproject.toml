[build-system]
requires = ["meson-python", "vapoursynth>=80"]
build-backend = "mesonpy"

[project]
name = "vapoursynth-knlmeansvk"
dynamic = ["version"]
description = "Non-local means de-noising on the VapourSynth Vulkan GPU device"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Edoardo Brunetti", email = "edo.brunetti@gmail.com" }]
maintainers = [
    { name = "Jaded Encoding Thaumaturgy", email = "jaded.encoding.thaumaturgy@gmail.com" },
]
dependencies = ["vapoursynth>=80"]

[project.urls]
"Source Code" = "https://github.com/Jaded-Encoding-Thaumaturgy/vapoursynth-knlmeansvk"
"Bug Tracker" = "https://github.com/Jaded-Encoding-Thaumaturgy/vapoursynth-knlmeansvk/issues"
"Changelog" = "https://github.com/Jaded-Encoding-Thaumaturgy/vapoursynth-knlmeansvk/blob/master/CHANGELOG"
"Contact" = "https://discord.gg/XTpc6Fa9eB"

# The import library meson installs beside the DLL on Windows is for linking against the
# module, which nothing does; VapourSynth only loads the DLL.
[tool.meson-python.wheel]
exclude = ["*/*.dll.a", "*/*.lib"]
