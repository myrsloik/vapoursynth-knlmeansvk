name: Build for Windows

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Fetch Vulkan headers
        run: git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git vulkan-headers

      - name: Build wheel
        shell: pwsh
        run: |
          $env:MESON_ARGS = "-Db_vscrt=mt -Dvulkan_include=$PWD\vulkan-headers\include"
          uv build --wheel

      - name: Upload VapourSynth plugin
        uses: actions/upload-artifact@v7
        with:
          name: knlmeansvk-vs-windows-x64
          path: dist/*
