name: Build

on: [push, pull_request, workflow_dispatch]

# meson-python tags a wheel that carries anything in platlib for the CPython it was built
# with, and the plugin is loaded by VapourSynth rather than imported, so every job retags
# its wheel py3-none-<platform> and one wheel per platform serves every Python.

jobs:
  build-non-windows-wheel:
    strategy:
      matrix:
        include:
        - arch: linux_x86_64
          runs-on: ubuntu-latest
        - arch: linux_aarch64
          runs-on: ubuntu-24.04-arm
        - arch: macosx_x86_64
          runs-on: macos-26-intel
        - arch: macosx_arm64
          runs-on: macos-26
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v7

    # The Linux wheels are built inside cibuildwheel's manylinux containers and repaired by
    # auditwheel, which is what makes them installable on distributions older than the
    # runner; macOS has no container and builds on the host.
    - uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_BUILD: cp314-*
        CIBW_BUILD_FRONTEND: uv
        # Headers only: nothing links the Vulkan loader, the core hands the plugin every entry
        # point already resolved. Taken from Khronos rather than the distribution package
        # because VSVulkan4.h is written against Vulkan 1.4, whose vkMapMemory2 and
        # vkUnmapMemory2 the 1.3.x packages these images ship do not declare. The macOS clone
        # runs on the host, the Linux one inside the container, hence the differing paths.
        CIBW_BEFORE_ALL_LINUX: >
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /opt/vulkan-headers
        CIBW_BEFORE_ALL_MACOS: >
          rm -rf /tmp/vulkan-headers &&
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
        # Static runtimes on Linux, so the binary depends on nothing beyond glibc.
        CIBW_CONFIG_SETTINGS_LINUX: setup-args=-Dstatic=true setup-args=-Dvulkan_include=/opt/vulkan-headers/include
        CIBW_CONFIG_SETTINGS_MACOS: setup-args=-Dvulkan_include=/tmp/vulkan-headers/include
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=15
        # No manylinux image pin: cibuildwheel then builds in the image whose policy it also
        # repairs against, so the two cannot disagree. Pinning one to manylinux_2_34 produced a
        # binary auditwheel rejected for referencing symbols newer than that policy allows.
        CIBW_SKIP: "*-musllinux*"
      with:
        output-dir: dist
        extras: uv

    - name: Fix tag
      run: |
        cd dist
        for whl in *.whl; do
          pipx run wheel tags --remove --python-tag py3 --abi-tag none $whl
        done

    - uses: actions/upload-artifact@v7
      with:
        name: knlmeansvk-${{ matrix.arch }}
        path: dist

  build-windows-wheel:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: astral-sh/setup-uv@v8.0.0

    - name: Fetch Vulkan headers
      run: git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$env:RUNNER_TEMP\vulkan-headers"

    # b_vscrt=mt so the plugin carries no dependency on the redistributable runtime. Forward
    # slashes so the path survives every layer between here and meson, which accepts either
    # form.
    - name: Build
      run: |
        $vulkanInclude = "$env:RUNNER_TEMP\vulkan-headers\include".Replace('\', '/')
        uv build -Csetup-args="-Db_vscrt=mt" -Csetup-args="-Dvulkan_include=$vulkanInclude"

    - name: Fix tag
      run: |
        cd dist
        Get-ChildItem *.whl | ForEach-Object { uvx wheel tags --remove --python-tag py3 --abi-tag none $_.Name }

    - uses: actions/upload-artifact@v7
      with:
        name: knlmeansvk-sdist
        path: dist/*.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        name: knlmeansvk-win_amd64
        path: dist/*.whl

  publish:
    permissions:
      id-token: write
    needs: [build-non-windows-wheel, build-windows-wheel]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
