name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-non-windows-wheel:
    strategy:
      matrix:
        include:
        - arch: linux_x86_64
          runs-on: ubuntu-latest
        - arch: linux_aarch64
          runs-on: ubuntu-24.04-arm
        - arch: macosx_x86_64
          runs-on: macos-26-intel
        - arch: macosx_arm64
          runs-on: macos-26
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v7

    - uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_BUILD: cp314-*
        CIBW_BUILD_FRONTEND: uv
        # Headers only: nothing links the Vulkan loader, the core hands the plugin every entry
        # point already resolved. Taken from Khronos rather than the distribution package
        # because VSVulkan4.h is written against Vulkan 1.4, whose vkMapMemory2 and
        # vkUnmapMemory2 the 1.3.x packages these images ship do not declare. The macOS clone
        # runs on the host, the Linux one inside the container, hence the differing paths.
        CIBW_BEFORE_ALL_LINUX: >
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /opt/vulkan-headers
        CIBW_BEFORE_ALL_MACOS: >
          rm -rf /tmp/vulkan-headers &&
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
        CIBW_ENVIRONMENT_LINUX: MESON_ARGS="-Dstatic=true -Dvulkan_include=/opt/vulkan-headers/include"
        CIBW_ENVIRONMENT_MACOS: MESON_ARGS="-Dvulkan_include=/tmp/vulkan-headers/include" MACOSX_DEPLOYMENT_TARGET=15
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
      with:
        output-dir: dist
        extras: uv

    - uses: actions/upload-artifact@v7
      with:
        name: knlmeansvk-${{ matrix.arch }}
        path: dist

  build-windows-wheel:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: astral-sh/setup-uv@v8.0.0

    - name: Fetch Vulkan headers
      run: git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$env:RUNNER_TEMP\vulkan-headers"

    # b_vscrt=mt so the plugin carries no dependency on the redistributable runtime.
    - name: Build
      run: |
        $env:MESON_ARGS = "-Db_vscrt=mt -Dvulkan_include=$env:RUNNER_TEMP\vulkan-headers\include"
        uv build

    - uses: actions/upload-artifact@v7
      with:
        name: knlmeansvk-sdist
        path: dist/*.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        name: knlmeansvk-win_amd64
        path: dist/*.whl

  publish:
    permissions:
      id-token: write
    needs: [build-non-windows-wheel, build-windows-wheel]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
